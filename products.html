<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كتالوج المنتجات | Csparepart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px;">

  <!-- زر تغيير اللغة -->
  <div style="position: absolute; top: 20px; left: 20px; z-index: 1000;">
    <button class="lang-toggle" style="background: #0284c7; color: #fff; border: 1px solid #0284c7; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;">
      English / العربية
    </button>
  </div>

  <main style="max-width: 1200px; margin: 60px auto 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 30px;">
      <h1 style="font-size: 2rem; color: #38bdf8;" data-i18n="productTitle">كتالوج قطع الغيار والمعدات</h1>
      <a href="index.html" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;" data-i18n="navHome">← العودة للرئيسية</a>
    </div>

    <!-- شريط البحث والفلترة -->
    <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;">
      <input type="text" id="catalog-search" data-i18n-placeholder="productSearchPlaceholder" placeholder="ابحث برمز OEM أو اسم القطعة..." style="padding: 10px 15px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; width: 100%; max-width: 350px;">
      
      <div class="filter-group" style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button data-filter="all" style="padding: 8px 12px; background: #334155; color: #fff; border: none; border-radius: 4px; cursor: pointer;" data-i18n="allCategories">كل الفئات</button>
        <button data-filter="axles" style="padding: 8px 12px; background: #334155; color: #fff; border: none; border-radius: 4px; cursor: pointer;" data-i18n="axles">المحاور والتعليق</button>
        <button data-filter="brakes" style="padding: 8px 12px; background: #334155; color: #fff; border: none; border-radius: 4px; cursor: pointer;" data-i18n="brakes">أنظمة الفرامل</button>
        <button data-filter="towing" style="padding: 8px 12px; background: #334155; color: #fff; border: none; border-radius: 4px; cursor: pointer;" data-i18n="towing">السحب والاقتران</button>
        <button data-filter="electrical" style="padding: 8px 12px; background: #334155; color: #fff; border: none; border-radius: 4px; cursor: pointer;" data-i18n="electrical">الإضاءة والكهرباء</button>
      </div>
      
      <span id="product-count" style="color: #38bdf8; font-weight: bold;"></span>
    </div>

    <!-- الشبكة الديناميكية لعرض المنتجات من script.js -->
    <div id="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;">
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
